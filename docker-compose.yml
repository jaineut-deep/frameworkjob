services:
  db:
    image: postgres:18.4-alpine3.23
    container_name: postgres
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8.2.7
    container_name: redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    container_name: backend
    env_file:
      - ./.env
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    command:
      - "/bin/bash"
      - "-c"
      - |
        python3 manage.py makemigrations &&
        python3 manage.py migrate &&
        python3 manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - celery_beat
    volumes:
      - .:/apps
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery:
    build: .
    container_name: celery
    user: celery:celery
    command:
      - "/bin/bash"
      - "-c"
      - |
        poetry run celery -A config worker -l INFO
    env_file:
      - ./.env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    depends_on:
      - db
      - redis
    volumes:
      - .:/apps
    restart: unless-stopped
    expose:
      - "8000"

  celery_beat:
    build: .
    container_name: celery_beat
    user: celery:celery
    env_file:
      - ./.env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    command:
      - "/bin/bash"
      - "-c"
      - |
        poetry run celery -A config beat -l INFO -S django
    depends_on:
      - db
      - redis
      - celery
    volumes:
      - .:/apps
    restart: unless-stopped
    expose:
      - "8000"

volumes:
  postgres_data:
  redis_data: